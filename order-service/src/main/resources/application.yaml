checkout:
  snapshot:
    enabled: ${SHOPSPHERE_CHECKOUT_SNAPSHOT_ENABLED:false}
    token-uri: ${SHOPSPHERE_ORDER_TOKEN_URI:}
    client-id: shopsphere-order
    client-secret: ${SHOPSPHERE_ORDER_CLIENT_SECRET:}
    connect-timeout: 2000
    read-timeout: 5000
    recovery:
      enabled: true
      interval: PT60S
      batch-size: 50
      lease: PT60S
      initial-backoff: PT60S
      max-backoff: PT15M
      warn-after: PT15M

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          cart-service:
            connectTimeout: 2000
            readTimeout: 5000
          catalog-service:
            connectTimeout: 2000
            readTimeout: 5000
