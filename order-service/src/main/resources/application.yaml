services:
  payment:
    url: ${SHOPSPHERE_PAYMENT_URL:http://localhost:8085}
  inventory:
    url: ${SHOPSPHERE_INVENTORY_URL:http://localhost:8084}

payment:
  connect-timeout: ${SHOPSPHERE_PAYMENT_CONNECT_TIMEOUT:2000}
  read-timeout: ${SHOPSPHERE_PAYMENT_READ_TIMEOUT:5000}

stock:
  connect-timeout: ${SHOPSPHERE_STOCK_CONNECT_TIMEOUT:2000}
  read-timeout: ${SHOPSPHERE_STOCK_READ_TIMEOUT:5000}
  recovery:
    enabled: ${SHOPSPHERE_STOCK_RECOVERY_ENABLED:true}
    interval: ${SHOPSPHERE_STOCK_RECOVERY_INTERVAL:PT60S}
    batch-size: ${SHOPSPHERE_STOCK_RECOVERY_BATCH_SIZE:50}
    lease: ${SHOPSPHERE_STOCK_RECOVERY_LEASE:PT60S}
    initial-backoff: ${SHOPSPHERE_STOCK_INITIAL_BACKOFF:PT60S}
    max-backoff: ${SHOPSPHERE_STOCK_MAX_BACKOFF:PT15M}
    monitor-interval: ${SHOPSPHERE_STOCK_MONITOR_INTERVAL:PT60S}
    warn-after: ${SHOPSPHERE_STOCK_WARN_AFTER:PT15M}

checkout:
  snapshot:
    enabled: ${SHOPSPHERE_CHECKOUT_SNAPSHOT_ENABLED:false}
    token-uri: ${SHOPSPHERE_ORDER_TOKEN_URI:}
    client-id: shopsphere-order
    client-secret: ${SHOPSPHERE_ORDER_CLIENT_SECRET:}
    connect-timeout: 2000
    read-timeout: 5000
    recovery:
      enabled: true
      interval: PT60S
      batch-size: 50
      lease: PT60S
      initial-backoff: PT60S
      max-backoff: PT15M
      warn-after: PT15M

spring:
  jpa:
    open-in-view: false
  application:
    name: order-service
  cloud:
    openfeign:
      client:
        config:
          cart-service:
            connectTimeout: 2000
            readTimeout: 5000
          catalog-service:
            connectTimeout: 2000
            readTimeout: 5000
